<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>경마 레이싱</title>
<style>
  :root { --bg:#12121a; --fg:#fff; --acc:#22c55e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  #app { height:100dvh; max-width:560px; margin:0 auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  a.back { color:#fff; opacity:.6; text-decoration:none; font-size:14px; }
  .top { display:flex; justify-content:space-between; font-weight:700; font-size:16px; }
  #wrap { position:relative; flex:1; min-height:0; }
  canvas { width:100%; height:100%; display:block; border-radius:16px; touch-action:none; background:#7dd3fc; }
  #ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:rgba(0,0,0,.6); border-radius:16px; text-align:center; padding:20px; }
  #ov h1 { margin:0; font-size:28px; }
  #ov p { margin:0; line-height:1.6; opacity:.9; font-size:15px; }
  #ov .big { font-size:48px; font-weight:800; color:#fde047; }
  .btn { border:0; border-radius:14px; padding:14px 30px; font-size:18px; font-weight:700; background:var(--acc); color:#12121a; cursor:pointer; margin-top:6px; }
  .hide { display:none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <a class="back" href="index.html">← 게임랜드</a>
  <div class="top"><span id="score">0 m</span><span id="spd"></span><span id="best"></span></div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="ov">
      <h1 id="ovt">🐎 경마 레이싱</h1>
      <div class="big hide" id="ovs"></div>
      <p id="ovp">← → 또는 터치로 피하기</p>
      <button class="btn" id="go">시작</button>
    </div>
  </div>
</div>

<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const OBST = ["🚧","🪨","🌵","🐘","🦓","🪵","🐂"];
const LANES = [-0.62, 0, 0.62];
const FAR = 14;                       // 장애물이 생기는 먼 거리
const PD = 0.3;                       // 플레이어 위치(거리). 작을수록 화면 아래
let W = 0, H = 0, dpr = 1, HY = 0;
let state = "ready", px, tx, obs, dist, v, phase, nextSpawn, keys = {}, last = 0, elapsed = 0, tilt = 0;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight; HY = H * 0.36;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);

function getBest() { try { return parseInt(localStorage.getItem("race_best")) || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem("race_best", v); } catch (e) {} }

// 원근: 거리 d → 화면 배율 s (d=0이면 1, 멀수록 작아짐)
const S = d => 1 / (1 + d * 0.4);
const SY = s => HY + (H - HY) * s;
const SX = (lat, s) => W / 2 + lat * W * 0.46 * s;

function reset() {
  resize();
  px = 0; tx = 0; obs = []; dist = 0; v = 4.5; phase = 0; nextSpawn = 4; elapsed = 0; tilt = 0;
}

function start() {
  reset(); state = "play";
  $("ov").classList.add("hide");
  last = performance.now();
  requestAnimationFrame(loop);
}

function over() {
  state = "over";
  const m = Math.floor(dist), b = getBest(), nb = m > b;
  if (nb) setBest(m);
  if (window.GL && m > 0) GL.report("race", m);
  $("ovt").textContent = nb ? "🎉 최고 기록!" : "💥 충돌!";
  $("ovs").textContent = m + " m";
  $("ovs").classList.remove("hide");
  $("ovp").textContent = nb ? "새로운 기록을 세웠어요!" : "내 최고 기록 " + b + " m";
  $("go").textContent = "다시 하기";
  $("ov").classList.remove("hide");
  $("best").textContent = "최고 " + Math.max(b, m) + " m";
}

function spawnWave() {
  const n = elapsed > 8 && Math.random() < Math.min(0.75, 0.25 + elapsed * 0.02) ? 2 : 1;   // 가끔 2칸을 막음 (항상 한 칸은 비움)
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5).slice(0, n);
  for (const l of lanes)
    obs.push({ lat: LANES[l] + (Math.random() - 0.5) * 0.1, d: FAR, e: OBST[Math.floor(Math.random() * OBST.length)] });
}

function update(dt) {
  elapsed += dt;
  v = Math.min(15, 4.5 + elapsed * 0.45);                 // 빠르게 가속
  phase += v * dt; dist += v * dt * 1.2;

  const sp = 1.7 + v * 0.07;                              // 좌우 이동 속도 (빨라질수록 더 민첩)
  if (keys.ArrowLeft) tx -= sp * dt;
  if (keys.ArrowRight) tx += sp * dt;
  tx = Math.max(-0.88, Math.min(0.88, tx));
  const prev = px;
  px += (tx - px) * Math.min(1, 16 * dt);
  tilt += (((px - prev) / Math.max(dt, 0.001)) * 0.12 - tilt) * Math.min(1, 10 * dt);

  nextSpawn -= v * dt;
  if (nextSpawn <= 0) { spawnWave(); nextSpawn = Math.max(3.2, 7 - elapsed * 0.08) * (0.8 + Math.random() * 0.5); }

  for (const o of obs) {
    const pd = o.d; o.d -= v * dt;
    // 지나가는 순간(스윕) 충돌 검사
    if (o.d <= PD + 0.35 && pd >= PD - 0.15 && Math.abs(o.lat - px) < 0.3) return over();
  }
  obs = obs.filter(o => o.d > -1.2);
  $("score").textContent = Math.floor(dist) + " m";
  $("spd").textContent = Math.round(v * 14) + " km/h";
}

function poly(pts, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}

function draw() {
  // 하늘
  const g = ctx.createLinearGradient(0, 0, 0, HY); g.addColorStop(0, "#38bdf8"); g.addColorStop(1, "#bae6fd");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HY + 2);
  ctx.fillStyle = "#fde047"; ctx.beginPath(); ctx.arc(W * 0.8, HY * 0.35, 26, 0, 7); ctx.fill();
  // 먼 산
  ctx.fillStyle = "#64748b";
  ctx.beginPath(); ctx.moveTo(0, HY); ctx.lineTo(W * 0.18, HY - 46); ctx.lineTo(W * 0.38, HY); ctx.lineTo(W * 0.55, HY - 62); ctx.lineTo(W * 0.78, HY); ctx.lineTo(W * 0.9, HY - 38); ctx.lineTo(W, HY); ctx.fill();

  // 도로와 풀밭 (거리 띠를 번갈아 칠함)
  const f = phase - Math.floor(phase), base = Math.floor(phase);
  for (let j = 24; j >= 0; j--) {
    const d1 = j - f, d2 = j + 1 - f;                       // j띠: 가까운쪽 d1, 먼쪽 d2
    const s1 = S(d1), s2 = S(d2), y1 = SY(s1), y2 = SY(s2), odd = (base + j) % 2;
    ctx.fillStyle = odd ? "#4ade80" : "#22c55e"; ctx.fillRect(0, y2, W, y1 - y2 + 1);
    const lx1 = SX(-1, s1), rx1 = SX(1, s1), lx2 = SX(-1, s2), rx2 = SX(1, s2);
    poly([lx1, y1, rx1, y1, rx2, y2, lx2, y2], odd ? "#9a7b4f" : "#8a6d43");              // 흙길
    const cl1 = SX(-1.07, s1), cl2 = SX(-1.07, s2), cr1 = SX(1.07, s1), cr2 = SX(1.07, s2); // 가장자리 울타리선
    poly([cl1, y1, lx1, y1, lx2, y2, cl2, y2], odd ? "#fff" : "#ef4444");
    poly([rx1, y1, cr1, y1, cr2, y2, rx2, y2], odd ? "#fff" : "#ef4444");
    if (odd) {                                                // 차선 점선
      for (const L of [-0.31, 0.31]) {
        const a1 = SX(L - 0.012, s1), b1 = SX(L + 0.012, s1), a2 = SX(L - 0.012, s2), b2 = SX(L + 0.012, s2);
        poly([a1, y1, b1, y1, b2, y2, a2, y2], "rgba(255,255,255,.7)");
      }
    }
  }

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // 장애물 (먼 것부터)
  obs.slice().sort((a, b) => b.d - a.d).forEach(o => {
    const s = S(Math.max(o.d, -0.9)), x = SX(o.lat, s), y = SY(s);
    const size = 120 * s;
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(x, y, size * 0.45, size * 0.12, 0, 0, 7); ctx.fill();
    ctx.font = size + "px serif"; ctx.fillText(o.e, x, y - size * 0.42);
  });

  // 플레이어 말
  const ps = S(PD), pxs = SX(px, ps), pys = SY(ps), psz = 130 * ps;
  ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(pxs, pys, psz * 0.5, psz * 0.13, 0, 0, 7); ctx.fill();
  const bob = Math.sin(phase * 5) * 4 * ps;
  ctx.save(); ctx.translate(pxs, pys - psz * 0.42 + bob); ctx.rotate(tilt);
  ctx.font = psz + "px serif"; ctx.fillText("🏇", 0, 0); ctx.restore();

  // 속도감 (가장자리 어둡게)
  const vg = ctx.createRadialGradient(W / 2, H * 0.6, H * 0.3, W / 2, H * 0.6, H * 0.85);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0," + Math.min(0.5, (v - 4) * 0.04) + ")");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function loop(t) {
  if (state !== "play") return;
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt);
  if (state === "play") draw();
  requestAnimationFrame(loop);
}

// 입력: 방향키 + 터치/드래그
function pointerLat(e) {
  const r = cv.getBoundingClientRect();
  tx = ((e.clientX - r.left) / r.width * 2 - 1) * 1.05;
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pointerLat(e); });
cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") pointerLat(e); });
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { keys[e.key] = true; e.preventDefault(); }
  else if ((e.key === "Enter" || e.key === " ") && state !== "play") start();
});
addEventListener("keyup", e => { keys[e.key] = false; });

$("go").onclick = start;
$("best").textContent = getBest() ? "최고 " + getBest() + " m" : "";
resize(); reset(); draw();
</script>
<script>window.GL_GAMES = [{ key:"race", label:"경마 레이싱", dir:"desc", fmt:d => d.value + " m" }];</script>
<script type="module" src="gl.js"></script>
</body>
</html>
