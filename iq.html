<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두뇌 IQ 테스트</title>
<style>
  :root { --bg:#12121a; --card:#1e1e2b; --fg:#fff; --acc:#7c5cff; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  #app { min-height:100dvh; max-width:560px; margin:0 auto; padding:20px 16px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:26px; margin:8px 0 0; text-align:center; }
  p { line-height:1.6; margin:0; }
  .center { text-align:center; }
  .muted { opacity:.6; font-size:13px; }
  .card { background:var(--card); border-radius:18px; padding:20px; }
  .top { display:flex; justify-content:space-between; font-size:14px; opacity:.8; }
  .bar { height:6px; background:#2c2c3d; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  .tag { display:inline-block; font-size:12px; background:#2c2c3d; border-radius:20px; padding:3px 10px; margin-bottom:10px; }
  .q { font-size:20px; font-weight:700; line-height:1.5; word-break:keep-all; white-space:pre-line; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .opt { border:2px solid #34344a; background:var(--card); color:var(--fg); font-size:17px; padding:15px;
    border-radius:14px; text-align:left; cursor:pointer; }
  .opt:active { transform:scale(.98); }
  .opt.ok { border-color:var(--ok); background:#14301f; }
  .opt.bad { border-color:var(--bad); background:#3a1717; }
  .btn { border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:700; background:var(--acc); color:#fff; cursor:pointer; width:100%; }
  .btn.alt { background:#fff; color:#12121a; }
  .hide { display:none !important; }
  .score { font-size:64px; font-weight:800; color:var(--acc); text-align:center; line-height:1; margin:6px 0; }
  .row { display:flex; gap:8px; }
  .row .btn { flex:1; }
</style>
</head>
<body>
<div id="app">
  <a href="index.html" style="color:#fff;opacity:.6;text-decoration:none;font-size:14px">← 게임랜드</a>
  <section id="intro" class="card">
    <h1>🧠 두뇌 IQ 테스트</h1>
    <p class="center muted" style="margin:6px 0 16px">숫자 · 논리 · 언어 문제 20개</p>
    <p>숫자 규칙 찾기, 논리 추론, 언어 유추 문제를 풀고 내 두뇌 점수를 확인해 보세요. 문제마다 보기를 고르면 바로 정답이 공개됩니다.</p>
    <p class="muted" style="margin:14px 0 18px">※ 재미로 만든 오락용 테스트입니다. 실제 IQ 검사와는 무관하며, 결과는 의학적·학문적 의미가 없습니다. 이름이나 연락처 등 개인정보는 수집하지 않습니다.</p>
    <button class="btn" id="start">시작하기</button>
  </section>

  <section id="quiz" class="hide" style="display:contents">
    <div class="top"><span id="no"></span><span id="time">⏱ 0:00</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card"><span class="tag" id="cat"></span><div class="q" id="q"></div></div>
    <div class="opts" id="opts"></div>
    <button class="btn alt hide" id="next">다음 ▶</button>
  </section>

  <section id="end" class="hide card">
    <p class="center muted">나의 추정 IQ</p>
    <div class="score" id="iq"></div>
    <h1 id="title" style="font-size:22px"></h1>
    <p class="center" id="detail" style="margin:10px 0"></p>
    <p class="center muted" id="stat"></p>
    <p class="muted center" style="margin:12px 0">※ 오락용 결과입니다. 실제 지능과는 무관해요.</p>
    <div class="row"><button class="btn" id="share">링크 공유</button><button class="btn alt" id="again">다시 하기</button></div>
  </section>
</div>

<script>
// [분류, 문제, [보기...], 정답 보기 번호(0부터)]
const QUESTIONS = [
  ["숫자", "다음 수열의 빈칸은?\n2, 4, 8, 16, ?", ["24","30","32","36"], 2],
  ["숫자", "다음 수열의 빈칸은?\n1, 1, 2, 3, 5, 8, ?", ["11","12","13","14"], 2],
  ["숫자", "다음 수열의 빈칸은?\n3, 6, 11, 18, 27, ?", ["36","38","40","45"], 1],
  ["숫자", "다음 수열의 빈칸은?\n2, 6, 12, 20, 30, ?", ["40","42","44","48"], 1],
  ["숫자", "다음 수열의 빈칸은?\n1, 4, 9, 16, 25, ?", ["30","34","36","49"], 2],
  ["숫자", "다음 수열의 빈칸은?\n81, 27, 9, 3, ?", ["0","1","2","6"], 1],
  ["숫자", "다음 수열의 빈칸은?\n2, 3, 5, 7, 11, 13, ?", ["15","16","17","19"], 2],
  ["숫자", "다음 수열의 빈칸은?\n1, 2, 6, 24, 120, ?", ["240","600","720","840"], 2],
  ["숫자", "다음 수열의 빈칸은?\n4, 7, 12, 19, 28, ?", ["37","39","40","42"], 1],
  ["숫자", "다음 수열의 빈칸은?\n1, 3, 7, 15, 31, ?", ["47","55","62","63"], 3],
  ["논리", "모든 장미는 꽃이다.\n어떤 꽃은 금방 시든다.\n\n이로부터 확실하게 말할 수 있는 것은?",
    ["모든 장미는 금방 시든다","장미 중 금방 시드는 것이 있는지는 확실하지 않다","장미는 절대 시들지 않는다","모든 꽃은 장미다"], 1],
  ["논리", "철수는 영희보다 크고, 영희는 민수보다 크다.\n세 사람 중 가장 작은 사람은?", ["철수","영희","민수","알 수 없다"], 2],
  ["논리", "3시 15분일 때 시침과 분침 사이의 각도는?", ["0도","7.5도","15도","30도"], 1],
  ["논리", "공과 배트의 합이 11,000원이고 배트가 공보다 10,000원 비싸다.\n공의 가격은?", ["1,000원","500원","5,000원","100원"], 1],
  ["논리", "기계 5대가 5분 동안 물건 5개를 만든다.\n기계 100대가 물건 100개를 만들려면 몇 분이 걸릴까?", ["5분","20분","50분","100분"], 0],
  ["논리", "호수의 연꽃이 매일 두 배로 늘어나 48일째에 호수 전체를 덮었다.\n호수의 절반을 덮은 날은?", ["24일째","46일째","47일째","45일째"], 2],
  ["언어", "의사 : 병원 = 선생님 : ?", ["학교","교과서","학생","시험"], 0],
  ["언어", "나머지와 성격이 다른 하나는?", ["사과","배","당근","포도"], 2],
  ["언어", "뜨겁다 : 차갑다 = 높다 : ?", ["크다","낮다","멀다","깊다"], 1],
  ["언어", "나머지와 성격이 다른 하나는?\n16, 25, 36, 48, 49", ["16","25","48","49"], 2],
];

const $ = id => document.getElementById(id);
let idx = 0, correct = 0, startedAt = 0, timer = null, locked = false;

const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function show(id) {
  ["intro","quiz","end"].forEach(k => {
    $(k).classList.toggle("hide", k !== id);
    if (k === "quiz" && id === "quiz") $(k).style.display = "contents";
  });
  window.scrollTo(0, 0);
}

function start() {
  idx = 0; correct = 0; startedAt = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { $("time").textContent = "⏱ " + fmt(Math.floor((Date.now()-startedAt)/1000)); }, 500);
  show("quiz"); render();
}

function render() {
  const [cat, q, opts, ans] = QUESTIONS[idx];
  locked = false;
  $("no").textContent = "문제 " + (idx+1) + " / " + QUESTIONS.length;
  $("prog").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("cat").textContent = cat;
  $("q").textContent = q;
  $("next").classList.add("hide");
  $("opts").innerHTML = "";
  shuffle(opts.map((t, i) => ({ t, ok: i === ans }))).forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o.t;
    b.onclick = () => choose(b, o.ok);
    b.dataset.ok = o.ok ? "1" : "";
    $("opts").appendChild(b);
  });
}

function choose(btn, ok) {
  if (locked) return;
  locked = true;
  if (ok) correct++;
  document.querySelectorAll(".opt").forEach(b => { if (b.dataset.ok) b.classList.add("ok"); });
  if (!ok) btn.classList.add("bad");
  $("next").textContent = idx === QUESTIONS.length - 1 ? "결과 보기 ▶" : "다음 ▶";
  $("next").classList.remove("hide");
}

function finish() {
  clearInterval(timer);
  const sec = Math.floor((Date.now()-startedAt)/1000);
  const iq = 55 + Math.round(correct * 4.5); // 0개 55 ~ 10개 100(평균) ~ 20개 145
  const tiers = [
    [130, "🏆 최상위 두뇌", "거의 만점! 패턴을 꿰뚫어 보는 눈이 대단해요."],
    [115, "🌟 우수한 두뇌", "논리와 수리 감각이 뛰어난 편이에요."],
    [100, "🙂 평균 이상", "탄탄한 사고력을 가졌어요."],
    [85,  "👍 평균", "무난하고 균형 잡힌 두뇌예요."],
    [0,   "😅 워밍업 필요", "다시 도전하면 점수가 훨씬 오를 거예요!"],
  ];
  const t = tiers.find(x => iq >= x[0]);
  $("iq").textContent = iq;
  $("title").textContent = t[1];
  $("detail").textContent = t[2];
  $("stat").textContent = `정답 ${correct} / ${QUESTIONS.length} · 소요 시간 ${fmt(sec)}`;
  show("end");
  if (window.GL) GL.report("iq", correct * 1000 - Math.min(sec, 999), { iq, correct, sec });
}

$("start").onclick = start;
$("next").onclick = () => { ++idx < QUESTIONS.length ? render() : finish(); };
$("again").onclick = start;
$("share").onclick = async () => {
  const url = location.href, text = `나의 두뇌 IQ 테스트 결과: ${$("iq").textContent}점! 너도 해봐 👉`;
  try {
    if (navigator.share) await navigator.share({ title: "두뇌 IQ 테스트", text, url });
    else { await navigator.clipboard.writeText(text + " " + url); alert("링크가 복사됐어요!"); }
  } catch (e) {}
};
</script>
<script>window.GL_GAMES = [{ key:"iq", label:"IQ 테스트", dir:"desc", fmt:d => `${d.iq}점 · 정답 ${d.correct}/20 · ${d.sec}초` }];</script>
<script type="module" src="gl.js"></script>
</body>
</html>
