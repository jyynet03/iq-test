<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ Test</title>
<style>
  :root { --bg:#12121a; --card:#1e1e2b; --fg:#fff; --acc:#7c5cff; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  #app { min-height:100dvh; max-width:560px; margin:0 auto; padding:20px 16px; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:26px; margin:8px 0 0; text-align:center; }
  p { line-height:1.6; margin:0; }
  .center { text-align:center; }
  .muted { opacity:.6; font-size:13px; }
  .card { background:var(--card); border-radius:18px; padding:20px; }
  .top { display:flex; justify-content:space-between; font-size:14px; opacity:.8; }
  .bar { height:6px; background:#2c2c3d; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  .tag { display:inline-block; font-size:12px; background:#2c2c3d; border-radius:20px; padding:3px 10px; margin-bottom:10px; }
  .q { font-size:20px; font-weight:700; line-height:1.5; word-break:keep-all; white-space:pre-line; }
  .fig { margin:14px 0 0; text-align:center; }
  .fig svg { display:inline-block; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .opts.grid { display:grid; grid-template-columns:1fr 1fr; }
  .opts.grid .opt { display:grid; place-items:center; padding:10px; }
  .opt { border:2px solid #34344a; background:var(--card); color:var(--fg); font-size:17px; padding:15px;
    border-radius:14px; text-align:left; cursor:pointer; }
  .opt:active { transform:scale(.98); }
  .opt.ok { border-color:var(--ok); background:#14301f; }
  .opt.bad { border-color:var(--bad); background:#3a1717; }
  .btn { border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:700; background:var(--acc); color:#fff; cursor:pointer; width:100%; }
  .btn.alt { background:#fff; color:#12121a; }
  .hide { display:none !important; }
  .score { font-size:64px; font-weight:800; color:var(--acc); text-align:center; line-height:1; margin:6px 0; }
  .row { display:flex; gap:8px; }
  .row .btn { flex:1; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <a href="index.html" style="color:#fff;opacity:.6;text-decoration:none;font-size:14px">← GameLand</a>
  <section id="intro" class="card">
    <h1>🧠 IQ Test</h1>
    <p class="center muted" style="margin:6px 0 16px">30 questions · Numbers · Shapes · Logic · Words</p>
    <p class="muted center" style="margin:10px 0 18px">Just for fun</p>
    <button class="btn" id="start">Start</button>
  </section>

  <section id="quiz" class="hide" style="display:contents">
    <div class="top"><span id="no"></span><span id="time">⏱ 0:00</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card"><span class="tag" id="cat"></span><div class="q" id="q"></div><div class="fig" id="fig"></div></div>
    <div class="opts" id="opts"></div>
    <button class="btn alt hide" id="next">Next ▶</button>
  </section>

  <section id="end" class="hide card">
    <p class="center muted">Your estimated IQ</p>
    <div class="score" id="iq"></div>
    <h1 id="title" style="font-size:22px"></h1>
    <p class="center" id="detail" style="margin:10px 0"></p>
    <p class="center muted" id="stat"></p>
    <div class="row"><button class="btn" id="share">Share</button><button class="btn alt" id="again">Retry</button></div>
  </section>
</div>

<script>
// [분류, 문제, [보기...], 정답 보기 번호(0부터)]
const QUESTIONS = [
  ["Numbers", "What comes next?\n2, 4, 8, 16, ?", ["24","30","32","36"], 2],
  ["Numbers", "What comes next?\n1, 1, 2, 3, 5, 8, ?", ["11","12","13","14"], 2],
  ["Numbers", "What comes next?\n3, 6, 11, 18, 27, ?", ["36","38","40","45"], 1],
  ["Numbers", "What comes next?\n2, 6, 12, 20, 30, ?", ["40","42","44","48"], 1],
  ["Numbers", "What comes next?\n1, 4, 9, 16, 25, ?", ["30","34","36","49"], 2],
  ["Numbers", "What comes next?\n81, 27, 9, 3, ?", ["0","1","2","6"], 1],
  ["Numbers", "What comes next?\n2, 3, 5, 7, 11, 13, ?", ["15","16","17","19"], 2],
  ["Numbers", "What comes next?\n1, 2, 6, 24, 120, ?", ["240","600","720","840"], 2],
  ["Numbers", "What comes next?\n4, 7, 12, 19, 28, ?", ["37","39","40","42"], 1],
  ["Numbers", "What comes next?\n1, 3, 7, 15, 31, ?", ["47","55","62","63"], 3],
  ["Logic", "All roses are flowers.\nSome flowers fade quickly.\n\nWhat can we say for sure?",
    ["All roses fade quickly","We cannot be sure any roses fade quickly","Roses never fade","All flowers are roses"], 1],
  ["Logic", "Tom is taller than Amy, and Amy is taller than Ben.\nWho is the shortest?", ["Tom","Amy","Ben","Cannot tell"], 2],
  ["Logic", "At 3:15, what is the angle between the hour and minute hands?", ["0°","7.5°","15°","30°"], 1],
  ["Logic", "A bat and a ball cost $1.10 in total.\nThe bat costs $1.00 more than the ball.\nHow much is the ball?", ["$0.10","$0.05","$0.50","$0.01"], 1],
  ["Logic", "5 machines make 5 items in 5 minutes.\nHow long do 100 machines take to make 100 items?", ["5 min","20 min","50 min","100 min"], 0],
  ["Logic", "Lily pads double every day and cover the whole lake on day 48.\nOn which day was half the lake covered?", ["Day 24","Day 46","Day 47","Day 45"], 2],
  ["Words", "Doctor : Hospital = Teacher : ?", ["School","Textbook","Student","Exam"], 0],
  ["Words", "Which one does not belong?", ["Apple","Pear","Carrot","Grape"], 2],
  ["Words", "Hot : Cold = High : ?", ["Big","Low","Far","Deep"], 1],
  ["Words", "Which one does not belong?\n16, 25, 36, 48, 49", ["16","25","48","49"], 2],
];

// ---------- 도형 문제용 SVG 도우미 ----------
const PAL = ["#7c5cff","#f43f5e","#22c55e","#f59e0b","#38bdf8"];
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const ngon = (x, y, r, n) => pts(Array.from({ length:n }, (_, i) => { const a = (-90 + 360 / n * i) * Math.PI / 180; return [x + r * Math.cos(a), y + r * Math.sin(a)]; }));
const starp = (x, y, r) => pts(Array.from({ length:10 }, (_, i) => { const a = (-90 + 36 * i) * Math.PI / 180, q = i % 2 ? r * 0.45 : r; return [x + q * Math.cos(a), y + q * Math.sin(a)]; }));
function sh(t, x, y, s, o) {
  o = o || {};
  const c = o.c || PAL[0], r = s / 2;
  const st = `fill="${o.hollow ? "none" : c}" stroke="${c}" stroke-width="${o.hollow ? 4 : 2}" stroke-linejoin="round"`;
  const rot = o.rot ? ` transform="rotate(${o.rot} ${x} ${y})"` : "";
  let g;
  if (t === "circle") g = `<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`;
  else if (t === "square") g = `<rect x="${x - r}" y="${y - r}" width="${s}" height="${s}" rx="2" ${st}/>`;
  else if (t === "tri") g = `<polygon points="${pts([[x, y - r], [x + r, y + r * 0.8], [x - r, y + r * 0.8]])}" ${st}/>`;
  else if (t === "star") g = `<polygon points="${starp(x, y, r)}" ${st}/>`;
  else if (t === "hex") g = `<polygon points="${ngon(x, y, r, 6)}" ${st}/>`;
  else g = `<polygon points="${ngon(x, y, r, 5)}" ${st}/>`;
  return `<g${rot}>${g}</g>`;
}
const BOX = `<rect x="1" y="1" width="58" height="58" rx="10" fill="#12121a" stroke="#34344a" stroke-width="2"/>`;
const QM = `<text x="30" y="41" text-anchor="middle" font-size="32" font-weight="800" fill="#fde047">?</text>`;
function row(cells) {                       // 칸 여러 개를 가로로 (null = 물음표 칸)
  const w = cells.length * 70 - 10;
  return `<svg viewBox="0 0 ${w} 60" style="width:100%;max-width:${Math.min(Math.round(w * 1.5), 420)}px">` +
    cells.map((c, i) => `<g transform="translate(${i * 70} 0)">${BOX}${c === null ? QM : c}</g>`).join("") + `</svg>`;
}
function grid3(cells) {                     // 3x3 표
  return `<svg viewBox="0 0 200 200" style="width:100%;max-width:240px">` + cells.map((c, i) =>
    `<g transform="translate(${(i % 3) * 70} ${Math.floor(i / 3) * 70})">${BOX}${c === null ? QM : c}</g>`).join("") + `</svg>`;
}
const O = inner => ({ svg: inner });        // 그림 보기
const DOTP = [[18,16],[42,16],[18,30],[42,30],[18,44],[42,44]];
const dots = n => DOTP.slice(0, n).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${PAL[1]}"/>`).join("");
const arrow = r => `<g transform="rotate(${r} 30 30)"><line x1="30" y1="46" x2="30" y2="16" stroke="${PAL[2]}" stroke-width="5" stroke-linecap="round"/><polygon points="30,8 40,22 20,22" fill="${PAL[2]}"/></g>`;
const quadr = q => {                        // 0=오른쪽위 1=오른쪽아래 2=왼쪽아래 3=왼쪽위 사분면을 칠함
  const a1 = (-90 + 90 * q) * Math.PI / 180, a2 = a1 + Math.PI / 2, R = 22;
  const p1 = [30 + R * Math.cos(a1), 30 + R * Math.sin(a1)], p2 = [30 + R * Math.cos(a2), 30 + R * Math.sin(a2)];
  return `<path d="M30 30 L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} A${R} ${R} 0 0 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} Z" fill="${PAL[3]}"/>` +
    `<circle cx="30" cy="30" r="${R}" fill="none" stroke="#6b6b85" stroke-width="2"/><line x1="8" y1="30" x2="52" y2="30" stroke="#6b6b85"/><line x1="30" y1="8" x2="30" y2="52" stroke="#6b6b85"/>`;
};
function mino(cells, color) {               // 네모 4개로 이루어진 조각
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]), u = 14;
  const w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;
  const ox = 30 - w * u / 2 - Math.min(...xs) * u, oy = 30 - h * u / 2 - Math.min(...ys) * u;
  return cells.map(c => `<rect x="${ox + c[0] * u}" y="${oy + c[1] * u}" width="${u - 1}" height="${u - 1}" rx="2" fill="${color}"/>`).join("");
}
const tri = r => sh("tri", 30, 30, 34, { rot: r, c: PAL[2] });
const L3 = [[0,0],[0,1],[0,2],[1,2]];

const FIGQ = [
  ["Shapes", "The shape keeps rotating.\nWhat comes next?",
    [O(tri(270)), O(tri(0)), O(tri(90)), O(tri(180))], 0, row([tri(0), tri(90), tri(180), null])],
  ["Shapes", "The dots keep increasing.\nWhat comes next?",
    [O(dots(4)), O(dots(3)), O(dots(5)), O(dots(6))], 0, row([dots(1), dots(2), dots(3), null])],
  ["Shapes", "Find the repeating pattern.\nWhat comes next?",
    [O(sh("circle", 30, 30, 34, { c: PAL[0] })), O(sh("tri", 30, 30, 34, { c: PAL[2] })), O(sh("square", 30, 30, 32, { c: PAL[1] })), O(sh("star", 30, 30, 40, { c: PAL[3] }))], 0,
    row([sh("tri", 30, 30, 34, { c: PAL[2] }), sh("square", 30, 30, 32, { c: PAL[1] }), sh("circle", 30, 30, 34, { c: PAL[0] }), sh("tri", 30, 30, 34, { c: PAL[2] }), sh("square", 30, 30, 32, { c: PAL[1] }), null])],
  ["Shapes", "The arrow turns 45° each step.\nWhat comes next?",
    [O(arrow(180)), O(arrow(225)), O(arrow(0)), O(arrow(270))], 0, row([arrow(0), arrow(45), arrow(90), arrow(135), null])],
  ["Shapes", "Which shape is different?",
    ["#1", "#2", "#3", "#4"], 2,
    row([sh("hex", 30, 30, 38, { c: PAL[4] }), sh("hex", 30, 30, 38, { c: PAL[4], rot: 15 }), sh("pent", 30, 30, 38, { c: PAL[4] }), sh("hex", 30, 30, 38, { c: PAL[4], rot: 30 })]), true],
  ["Shapes", "Each row and column has each shape once.\nWhat goes in the ?",
    [O(sh("square", 30, 30, 32, { c: PAL[1] })), O(sh("circle", 30, 30, 34, { c: PAL[0] })), O(sh("tri", 30, 30, 34, { c: PAL[2] })), O(sh("star", 30, 30, 40, { c: PAL[3] }))], 0,
    grid3([sh("circle", 30, 30, 34, { c: PAL[0] }), sh("square", 30, 30, 32, { c: PAL[1] }), sh("tri", 30, 30, 34, { c: PAL[2] }),
           sh("square", 30, 30, 32, { c: PAL[1] }), sh("tri", 30, 30, 34, { c: PAL[2] }), sh("circle", 30, 30, 34, { c: PAL[0] }),
           sh("tri", 30, 30, 34, { c: PAL[2] }), sh("circle", 30, 30, 34, { c: PAL[0] }), null])],
  ["Shapes", "The circle keeps growing.\nWhat comes next?",
    [O(sh("circle", 30, 30, 42, { c: PAL[4] })), O(sh("circle", 30, 30, 34, { c: PAL[4] })), O(sh("circle", 30, 30, 52, { c: PAL[4] })), O(sh("circle", 30, 30, 26, { c: PAL[4] }))], 0,
    row([sh("circle", 30, 30, 10, { c: PAL[4] }), sh("circle", 30, 30, 18, { c: PAL[4] }), sh("circle", 30, 30, 26, { c: PAL[4] }), sh("circle", 30, 30, 34, { c: PAL[4] }), null])],
  ["Shapes", "The colored part moves clockwise.\nWhat comes next?",
    [O(quadr(3)), O(quadr(0)), O(quadr(1)), O(quadr(2))], 0, row([quadr(0), quadr(1), quadr(2), null])],
  ["Shapes", "Which is the mirror image (flipped left-right)?",
    [O(mino([[1,0],[1,1],[1,2],[0,2]], PAL[1])), O(mino([[0,2],[0,1],[0,0],[1,0]], PAL[1])), O(mino([[2,0],[1,0],[0,0],[0,1]], PAL[1])), O(mino(L3, PAL[1]))], 0,
    row([mino(L3, PAL[0])])],
  ["Shapes", "Each shape is a number.\n\n▲ + ▲ + ▲ = 9\n▲ + ■ = 8\n■ + ● = 9\n\nWhat is ●?", ["3", "4", "5", "6"], 1],
];
QUESTIONS.splice(10, 0, ...FIGQ);          // 숫자 문제 뒤에 도형 문제를 끼워 넣음 (총 30문제)

const $ = id => document.getElementById(id);
let idx = 0, correct = 0, startedAt = 0, timer = null, locked = false;

const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function show(id) {
  ["intro","quiz","end"].forEach(k => {
    $(k).classList.toggle("hide", k !== id);
    if (k === "quiz" && id === "quiz") $(k).style.display = "contents";
  });
  window.scrollTo(0, 0);
}

function start() {
  idx = 0; correct = 0; startedAt = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { $("time").textContent = "⏱ " + fmt(Math.floor((Date.now()-startedAt)/1000)); }, 500);
  show("quiz"); render();
}

function render() {
  const [cat, q, opts, ans, fig, keep] = QUESTIONS[idx];
  locked = false;
  $("fig").innerHTML = fig || "";
  $("fig").style.display = fig ? "block" : "none";
  $("opts").className = "opts" + (opts[0] && opts[0].svg ? " grid" : "");
  $("no").textContent = "Q " + (idx+1) + " / " + QUESTIONS.length;
  $("prog").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("cat").textContent = cat;
  $("q").textContent = q;
  $("next").classList.add("hide");
  $("opts").innerHTML = "";
  const list = opts.map((t, i) => ({ t, ok: i === ans }));
  (keep ? list : shuffle(list)).forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    if (o.t && o.t.svg) b.innerHTML = `<svg viewBox="0 0 60 60" width="68" height="68">${o.t.svg}</svg>`;
    else b.textContent = o.t;
    b.onclick = () => choose(b, o.ok);
    b.dataset.ok = o.ok ? "1" : "";
    $("opts").appendChild(b);
  });
}

function choose(btn, ok) {
  if (locked) return;
  locked = true;
  if (ok) correct++;
  document.querySelectorAll(".opt").forEach(b => { if (b.dataset.ok) b.classList.add("ok"); });
  if (!ok) btn.classList.add("bad");
  $("next").textContent = idx === QUESTIONS.length - 1 ? "Results ▶" : "Next ▶";
  $("next").classList.remove("hide");
}

function finish() {
  clearInterval(timer);
  const sec = Math.floor((Date.now()-startedAt)/1000);
  const iq = 55 + Math.round(correct * 3); // 0개 55 ~ 15개 100(평균) ~ 30개 145
  const tiers = [
    [130, "🏆 Genius", "Almost perfect!"],
    [115, "🌟 Sharp", "Great logic and number sense."],
    [100, "🙂 Above average", "Solid thinking."],
    [85,  "👍 Average", "Nicely balanced."],
    [0,   "😅 Warming up", "Try again!"],
  ];
  const t = tiers.find(x => iq >= x[0]);
  $("iq").textContent = iq;
  $("title").textContent = t[1];
  $("detail").textContent = t[2];
  $("stat").textContent = `${correct} / ${QUESTIONS.length} correct · ${fmt(sec)}`;
  show("end");
  if (window.GL) GL.report("iq", correct * 1000 - Math.min(sec, 999), { iq, correct, sec });
}

$("start").onclick = start;
$("next").onclick = () => { ++idx < QUESTIONS.length ? render() : finish(); };
$("again").onclick = start;
$("share").onclick = async () => {
  const url = location.href, text = `My IQ Test score: ${$("iq").textContent}! Try it 👉`;
  try {
    if (navigator.share) await navigator.share({ title: "IQ Test", text, url });
    else { await navigator.clipboard.writeText(text + " " + url); alert("Link copied!"); }
  } catch (e) {}
};
</script>
<script>window.GL_GAMES = [{ key:"iq", label:"IQ Test", dir:"desc", fmt:d => `IQ ${d.iq} · ${d.correct}/30 · ${d.sec}s` }];</script>
<script type="module" src="gl.js"></script>
</body>
</html>
