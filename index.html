<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임랜드</title>
<style>
  :root { --bg:#232527; --panel:#393b3d; --line:#0d0d0e; --fg:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; color:var(--fg); background-color:var(--bg);
    /* 바닥판의 볼록한 돌기(스터드) 무늬 */
    background-image:radial-gradient(circle at center, rgba(255,255,255,.07) 0 5px, transparent 6px);
    background-size:34px 34px;
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif; font-weight:800; }
  #app { min-height:100dvh; max-width:1200px; margin:0 auto; padding:22px 14px 28px; display:flex; flex-direction:column; gap:16px; }

  /* 상단 로고 바 */
  header { display:flex; align-items:center; justify-content:center; gap:10px; background:var(--panel); border:3px solid var(--line);
    border-radius:12px; padding:12px 14px; box-shadow:0 5px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.12); }
  .logo { width:44px; height:44px; flex:none; display:grid; place-items:center; font-size:26px; background:#e2231a; border:3px solid var(--line);
    border-radius:8px; transform:rotate(-8deg); box-shadow:0 3px 0 #8f130d, inset 0 3px 0 rgba(255,255,255,.35); }
  h1 { margin:0; font-size:32px; font-weight:900; letter-spacing:1px; text-shadow:3px 3px 0 var(--line); }
  .sub { margin:0; text-align:center; opacity:.8; font-size:15px; font-weight:700; }

  /* 넓은 화면 6열 → 중간 3열 → 폰 2열 */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  @media (min-width:640px) { .grid { grid-template-columns:repeat(3,1fr); } }
  @media (min-width:960px) { .grid { grid-template-columns:repeat(6,1fr); gap:12px; }
    .info b { font-size:15px; } .info em { font-size:11px; } .play { font-size:14px; margin:4px 8px 8px; }
    .thumb { font-size:50px; } header { max-width:520px; margin:0 auto; width:100%; } }
  @media (max-width:340px) { .grid { grid-template-columns:1fr; } }

  /* 게임 카드 */
  .card { --c1:#7c5cff; --c2:#4f46e5; --edge:#2b2196;
    position:relative; display:flex; flex-direction:column; text-decoration:none; color:#fff; background:var(--panel);
    border:3px solid var(--line); border-radius:12px; overflow:hidden;
    box-shadow:0 6px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.12); transition:transform .08s, box-shadow .08s; }
  .thumb { position:relative; aspect-ratio:1/0.82; display:grid; place-items:center; font-size:58px; border-bottom:3px solid var(--line);
    background:
      radial-gradient(circle at center, rgba(255,255,255,.22) 0 4px, transparent 5px) 0 0/22px 22px,
      linear-gradient(180deg,var(--c1),var(--c2)); }
  .thumb span { filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)); transform:rotate(-6deg); transition:transform .15s; }
  .tag { position:absolute; top:6px; left:6px; background:rgba(0,0,0,.55); border-radius:6px; padding:2px 8px; font-size:11px; font-weight:800; }
  .info { padding:10px 10px 8px; display:flex; flex-direction:column; gap:3px; flex:1; }
  .info b { font-size:16px; font-weight:900; line-height:1.25; }
  .info em { font-style:normal; font-size:12px; font-weight:600; opacity:.7; line-height:1.4; }
  .play { margin:4px 10px 10px; text-align:center; font-size:16px; font-weight:900; padding:9px 0; border-radius:8px; color:#fff;
    background:#00b06f; border:3px solid var(--line); box-shadow:0 4px 0 #006b43, inset 0 3px 0 rgba(255,255,255,.35); text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .card.wide { grid-column:1 / -1; flex-direction:row; }
  .card.wide .thumb { width:38%; aspect-ratio:auto; border-bottom:0; border-right:3px solid var(--line); font-size:46px; }
  .card.wide .side { flex:1; display:flex; flex-direction:column; }

  @media (hover:hover) { .card:hover { transform:translateY(-3px); box-shadow:0 9px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.12); }
    .card:hover .thumb span { transform:rotate(4deg) scale(1.12); } }
  .card:active { transform:translateY(5px); box-shadow:0 1px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.12); }
  .card:active .play { transform:translateY(2px); box-shadow:0 2px 0 #006b43, inset 0 3px 0 rgba(255,255,255,.35); }

  .iq   { --c1:#a78bfa; --c2:#5b4be0; }
  .hid  { --c1:#ffb23d; --c2:#ee4b3f; }
  .race { --c1:#4be07a; --c2:#13a0d6; }
  .tow  { --c1:#ff6b8a; --c2:#b04ee6; }
  .bal  { --c1:#ffd23a; --c2:#1fae5c; }
  .cat  { --c1:#ffa04d; --c2:#f0489c; }
  .rank { --c1:#fde047; --c2:#f59e0b; }
  .brd  { --c1:#4cc3ff; --c2:#5d63f0; }

  footer { margin-top:auto; padding-top:6px; text-align:center; opacity:.5; font-size:12px; line-height:1.6; font-weight:600; }
  @media (prefers-reduced-motion:reduce) { .card, .thumb span { transition:none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <header><div class="logo">🎮</div><h1>게임랜드</h1></header>

  <div class="grid">
    <a class="card iq" href="iq.html">
      <div class="thumb"><span>🧠</span></div>
      <div class="info"><b>IQ 테스트</b></div>
      <div class="play">▶ 플레이</div>
    </a>
    <a class="card hid" href="hidden.html">
      <div class="thumb"><span>🍒</span></div>
      <div class="info"><b>체리 찾아라</b></div>
      <div class="play">▶ 플레이</div>
    </a>
    <a class="card race" href="race.html">
      <div class="thumb"><span>🐎</span></div>
      <div class="info"><b>경마 레이싱</b></div>
      <div class="play">▶ 플레이</div>
    </a>
    <a class="card tow" href="tower.html">
      <div class="thumb"><span>🧱</span></div>
      <div class="info"><b>블록 탑쌓기</b></div>
      <div class="play">▶ 플레이</div>
    </a>
    <a class="card bal" href="ball.html">
      <div class="thumb"><span>⚽</span></div>
      <div class="info"><b>공 맞추기</b></div>
      <div class="play">▶ 플레이</div>
    </a>
    <a class="card cat" href="cat.html">
      <div class="thumb"><span>🐱</span></div>
      <div class="info"><b>고양이 밥주기</b></div>
      <div class="play">▶ 플레이</div>
    </a>
    <a class="card wide rank" href="ranking.html">
      <div class="thumb"><span>👑</span></div>
      <div class="side">
        <div class="info"><b>총 랭킹</b></div>
        <div class="play">🏆 순위 보기</div>
      </div>
    </a>
    <a class="card wide brd" href="board.html">
      <div class="thumb"><span>💬</span></div>
      <div class="side">
        <div class="info"><b>게임 요청 게시판</b></div>
        <div class="play">✏️ 글 남기기</div>
      </div>
    </a>
  </div>

  <footer>재미로 만든 게임 · 개인정보는 수집하지 않아요</footer>
</div>
</body>
</html>
