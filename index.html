<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 모음</title>
<style>
  :root { --bg:#12121a; --card:#1e1e2b; --fg:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  #app { min-height:100dvh; max-width:560px; margin:0 auto; padding:28px 16px; display:flex; flex-direction:column; gap:16px; }
  h1 { text-align:center; font-size:28px; margin:10px 0 0; }
  .sub { text-align:center; opacity:.6; font-size:14px; margin:0 0 10px; }
  a.game { display:block; text-decoration:none; color:#fff; border-radius:20px; padding:26px 22px; }
  a.game:active { transform:scale(.98); }
  a.game b { display:block; font-size:22px; margin-bottom:6px; }
  a.game span { font-size:14px; opacity:.9; }
  .iq { background:linear-gradient(135deg,#7c5cff,#4f46e5); }
  .hid { background:linear-gradient(135deg,#f59e0b,#ef4444); }
  footer { margin-top:auto; text-align:center; opacity:.45; font-size:12px; line-height:1.6; }
</style>
</head>
<body>
<div id="app">
  <h1>🎮 게임 모음</h1>
  <p class="sub">하고 싶은 게임을 골라보세요</p>
  <a class="game iq" href="iq.html"><b>🧠 IQ 테스트</b><span>숫자 · 논리 · 언어 20문제, 내 두뇌 점수는?</span></a>
  <a class="game hid" href="hidden.html"><b>🔍 숨은그림찾기</b><span>빽빽한 이모지 속에서 목표물을 가장 빨리 찾아라</span></a>
  <footer>재미로 만든 오락용 게임입니다.<br>이름·연락처 등 개인정보를 입력하거나 수집하지 않습니다.</footer>
</div>
</body>
</html>
