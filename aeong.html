<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애옹이와 이구동성</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  #app { min-height:100dvh; max-width:560px; margin:0 auto; padding:14px 14px 30px; display:flex; flex-direction:column; gap:14px; }
  a.back { text-decoration:none; font-size:14px; }
  h1 { margin:6px 0 0; text-align:center; font-size:26px; }
  .center { text-align:center; }
  .muted { color:var(--sub); font-size:14px; }
  .card { padding:20px; }
  .hide { display:none !important; }
  .cat { font-size:64px; text-align:center; line-height:1; }
  .top { display:flex; justify-content:space-between; font-weight:800; font-size:15px; }
  .bar { height:8px; } .bar i { display:block; height:100%; width:0; transition:width .3s; }
  .q { text-align:center; font-size:22px; font-weight:900; margin:6px 0 2px; }
  .vs { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:stretch; }
  .vs b { align-self:center; color:var(--sub); font-weight:900; }
  .opt { min-height:130px; font-size:22px; padding:16px 10px; word-break:keep-all; }
  .btn { padding:15px; font-size:17px; width:100%; }
  .big { font-size:56px; text-align:center; margin:6px 0 0; }
  .crown { text-align:center; font-size:20px; font-weight:900; margin:4px 0; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li { display:flex; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:10px; background:var(--surf2); font-size:14px; }
  li .t { color:var(--sub); }
  li.o { box-shadow:inset 3px 0 0 var(--ok); } li.x { box-shadow:inset 3px 0 0 var(--warn); }
  .row { display:flex; gap:8px; } .row .btn { flex:1; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <a class="back" href="index.html">← <span class="brand" translate="no">애옹 랜드</span></a>

  <section id="intro" class="card">
    <div class="cat">🐱</div>
    <h1>애옹이와 이구동성</h1>
    <p class="center muted" style="margin:8px 0 18px">애옹이라면 뭘 골랐을까? 10문제</p>
    <button class="btn" id="start">시작</button>
  </section>

  <section id="quiz" class="hide" style="display:contents">
    <div class="top"><span id="no"></span><span>🐱 애옹이라면?</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="q" id="q"></div>
    <div class="vs"><button class="opt" id="o0"></button><b>VS</b><button class="opt" id="o1"></button></div>
  </section>

  <section id="end" class="hide card">
    <p class="center muted">애옹이와 이구동성</p>
    <div class="big" id="score"></div>
    <div class="crown" id="crown"></div>
    <ul id="review" style="margin:14px 0"></ul>
    <div class="row"><button class="btn" id="again">다시 하기</button><button class="btn alt" id="share">공유</button></div>
  </section>
</div>

<script>
// [질문, 보기A, 보기B] — 애옹이의 답은 코드에서 바로 보이지 않게 숫자로 감춰 둠
const QS = [
  ["좋아하는 야식",    "떡볶이",   "족발"],
  ["좋아하는 음료",    "게토레이", "카페라떼"],
  ["안 먹는 음식",     "애호박",   "깍두기"],
  ["좋아하는 계절",    "겨울",     "여름"],
  ["좋아하는 게임",    "알훔",     "롤체"],
  ["좋아하는 영화 장르", "액션",   "호러"],
  ["좋아하는 디저트",  "과일",     "케이크"],
  ["좋아하는 과일",    "딸기",     "수박"],
  ["가고 싶은 곳",     "바다",     "산"],
  ["좋아하는 운동",    "러닝",     "복싱"],
];
const K = 0x3C5 ^ 0x152;
QS.forEach((q, i) => q[3] = (K >> i) & 1);
const $ = id => document.getElementById(id);
let idx = 0, picks = [], order = [];

function show(id) {
  $("intro").classList.toggle("hide", id !== "intro");
  $("end").classList.toggle("hide", id !== "end");
  $("quiz").classList.toggle("hide", id !== "quiz");
  if (id === "quiz") $("quiz").style.display = "contents";
  scrollTo(0, 0);
}
function start() { idx = 0; picks = []; order = QS.map(() => Math.random() < 0.5); show("quiz"); render(); }
function render() {
  const [q, a, b] = QS[idx], sw = order[idx];               // 보기 좌우를 섞음
  $("no").textContent = (idx + 1) + " / " + QS.length;
  $("prog").style.width = (idx / QS.length * 100) + "%";
  $("q").textContent = q;
  $("o0").textContent = sw ? b : a; $("o0").dataset.v = sw ? 1 : 0;
  $("o1").textContent = sw ? a : b; $("o1").dataset.v = sw ? 0 : 1;
}
function pick(el) {
  picks[idx] = +el.dataset.v;
  if (++idx < QS.length) render(); else finish();
}
function finish() {
  const n = QS.reduce((s, q, i) => s + (picks[i] === q[3] ? 1 : 0), 0);
  $("score").textContent = n * 10 + "%";
  $("crown").textContent = n === 10 ? "👑 공동 1등! 완벽한 이구동성" : n >= 8 ? "😺 거의 애옹이!" : n >= 5 ? "🙂 꽤 통하는 사이" : "🙀 애옹이랑 정반대?!";
  // 정답은 공개하지 않음 (어떤 문제를 맞혔는지도 보여주지 않음 — 2지선다라 그것만으로 정답이 드러나기 때문)
  $("review").textContent = "";
  show("end");
  if (window.GL) GL.report("aeong", n);
}
$("o0").onclick = e => pick(e.currentTarget);
$("o1").onclick = e => pick(e.currentTarget);
$("start").onclick = start;
$("again").onclick = start;
$("share").onclick = async () => {
  const url = location.href, text = `나 애옹이랑 ${$("score").textContent} 이구동성! 너도 해봐 🐱`;
  try { if (navigator.share) await navigator.share({ title: "애옹이와 이구동성", text, url }); else { await navigator.clipboard.writeText(text + " " + url); alert("링크가 복사됐어요!"); } } catch (e) {}
};
</script>
<script>window.GL_GAMES = [{ key:"aeong", label:"애옹이와 이구동성", dir:"desc", fmt:d => d.value * 10 + "%" + (d.value === 10 ? " 👑" : "") }];</script>
<script type="module" src="gl.js"></script>
</body>
</html>
