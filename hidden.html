<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고양이 찾아라</title>
<style>
  :root { --bg:#12121a; --card:#1e1e2b; --fg:#fff; --acc:#f59e0b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; }
  #app { min-height:100dvh; max-width:560px; margin:0 auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px; }
  a.back { color:#fff; opacity:.6; text-decoration:none; font-size:14px; }
  h1 { font-size:24px; text-align:center; margin:4px 0; }
  .card { background:var(--card); border-radius:18px; padding:20px; }
  .muted { opacity:.6; font-size:13px; line-height:1.6; }
  .hide { display:none !important; }
  .btn { border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:700; background:var(--acc); color:#12121a; cursor:pointer; width:100%; }
  .btn.alt { background:#fff; }
  .lv { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .lv .btn small { display:block; font-weight:400; font-size:12px; opacity:.75; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:700; }
  #pen { color:#ef4444; font-size:13px; min-width:60px; text-align:right; }
  .targets { display:flex; gap:10px; justify-content:center; align-items:center; background:var(--card); border-radius:14px; padding:10px; font-size:15px; }
  .t { font-size:30px; line-height:1; padding:4px 8px; border-radius:10px; background:#2a2a3c; transition:.2s; }
  .t.done { opacity:.25; filter:grayscale(1); text-decoration:line-through; }
  #field { position:relative; width:100%; height:62dvh; min-height:360px; background:#f7f2e7; border-radius:16px; overflow:hidden; touch-action:manipulation; }
  #field canvas { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  #field.flash { animation:fl .25s; }
  @keyframes fl { 50% { box-shadow:inset 0 0 0 6px #ef4444; } }
  .big { font-size:54px; font-weight:800; text-align:center; color:var(--acc); margin:8px 0; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row .btn { flex:1; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <a class="back" href="index.html">← <span class="brand" translate="no">애옹 랜드</span></a>
  <h1>🐱 고양이 찾아라</h1>

  <section id="menu" class="card">
    <div class="lv" id="lv"></div>
  </section>

  <section id="play" style="display:none; flex-direction:column; gap:10px">
    <div class="top"><span id="lvname"></span><span id="time">0.0초</span><span id="pen"></span></div>
    <div class="targets" id="targets"></div>
    <div id="field"><canvas id="base"></canvas><canvas id="mark"></canvas></div>
  </section>

  <section id="end" class="card hide">
    <p class="muted" style="text-align:center" id="endlv"></p>
    <div class="big" id="endtime"></div>
    <p style="text-align:center" id="endmsg"></p>
    <div class="row"><button class="btn" id="again">다시 하기</button><button class="btn alt" id="tomenu">단계 선택</button></div>
  </section>
</div>

<script>
const TARGET = "🐱", DECOY = "🐯", COUNT = 10;   // 사과 속에서 체리 10개 찾기
// density: 화면을 사과가 덮는 정도 (클수록 겹쳐서 배경이 안 보임)
const LEVELS = {
  easy:   { name:"쉬움",   size:34, density:2.0 },
  normal: { name:"보통", size:28, density:2.8 },
  hard:   { name:"어려움",   size:22, density:3.8 },
};

const $ = id => document.getElementById(id);
let level = "easy", found = 0, total = 0, start = 0, tick = null, penalty = 0, over = false, mctx = null, targetsPos = [];

// 이모지를 한 번만 그려 둔 그림(스프라이트)을 만들어 두고 복사해서 쓰면 수백 개를 그려도 가볍다
const sprites = {};
function sprite(e) {
  if (!sprites[e]) {
    const c = document.createElement("canvas"); c.width = c.height = 96;
    const x = c.getContext("2d");
    x.font = "78px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(e, 48, 52);
    sprites[e] = c;
  }
  return sprites[e];
}

const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function best(lv) { try { return parseFloat(localStorage.getItem("hid_best_" + lv)) || null; } catch (e) { return null; } }
function saveBest(lv, v) { try { localStorage.setItem("hid_best_" + lv, v); } catch (e) {} }

function drawMenu() {
  $("lv").innerHTML = "";
  Object.keys(LEVELS).forEach(k => {
    const b = document.createElement("button");
    b.className = "btn";
    const bt = best(k);
    b.innerHTML = `${LEVELS[k].name}<small>${bt ? "🏅 " + bt.toFixed(1) + "초" : ""}</small>`;
    b.onclick = () => begin(k);
    $("lv").appendChild(b);
  });
}

function show(id) {
  $("menu").classList.toggle("hide", id !== "menu");
  $("end").classList.toggle("hide", id !== "end");
  $("play").style.display = id === "play" ? "flex" : "none";
  window.scrollTo(0, 0);
}

function begin(lv) {
  level = lv; const L = LEVELS[lv];
  found = 0; penalty = 0; over = false; total = COUNT;
  $("pen").textContent = "";
  $("lvname").textContent = L.name;
  show("play");
  // 화면을 먼저 바로 보여주고, 그림은 다음 프레임에 그린다 (누르자마자 화면이 바뀌도록)
  over = true; clearInterval(tick);
  $("time").textContent = "0.0초";
  $("targets").textContent = "🐯 호랑이 모으는 중...";
  requestAnimationFrame(() => setTimeout(() => build(L), 0));
}

function build(L) {
  const field = $("field");
  const W = field.clientWidth, H = field.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const base = $("base"), mark = $("mark");
  base.width = mark.width = W * dpr; base.height = mark.height = H * dpr;
  const bx = base.getContext("2d"); bx.setTransform(dpr, 0, 0, dpr, 0, 0);
  mctx = mark.getContext("2d"); mctx.setTransform(dpr, 0, 0, dpr, 0, 0); mctx.clearRect(0, 0, W, H);
  targetsPos = [];
  const decoys = Math.round(W * H / (L.size * L.size) * L.density);
  // 사과를 먼저 깔고 체리를 마지막에 얹는다 (체리는 겹쳐도 완전히 가려지지 않음)
  const items = [];
  for (let i = 0; i < decoys; i++) items.push({ e:DECOY, t:false });
  shuffle(items);
  for (let i = 0; i < COUNT; i++) items.splice(Math.floor(Math.random() * items.length * 0.4) + Math.floor(items.length * 0.6), 0, { e:TARGET, t:true });

  $("targets").innerHTML = `<span class="t">${TARGET}</span><span>호랑이 속 <b>고양이</b> <b id="left">${COUNT}</b>마리를 찾아라!</span>`;

  const n = items.length;
  const cols = Math.ceil(Math.sqrt(n * W / H)), rows = Math.ceil(n / cols);
  const cw = W / cols, ch = H / rows;
  const cells = shuffle([...Array(cols * rows).keys()]);
  items.forEach((it, i) => {
    const c = cells[i];
    it.x = (c % cols + 0.2 + Math.random() * 0.6) * cw;
    it.y = (Math.floor(c / cols) + 0.2 + Math.random() * 0.6) * ch;
    it.s = L.size * (0.85 + Math.random() * 0.3);
    it.rot = (Math.random() * 60 - 30) * Math.PI / 180;
  });
  bx.clearRect(0, 0, W, H);
  for (const pass of [false, true]) {                 // 사과 먼저, 체리는 맨 위에
    for (const it of items) {
      if (it.t !== pass) continue;
      bx.save(); bx.translate(it.x, it.y); bx.rotate(it.rot);
      bx.drawImage(sprite(it.e), -it.s / 2, -it.s / 2, it.s, it.s);
      bx.restore();
      if (it.t) targetsPos.push({ x: it.x, y: it.y, r: it.s * 0.65 + 4, done: false });
    }
  }

  over = false;
  start = Date.now();
  clearInterval(tick);
  tick = setInterval(() => { $("time").textContent = elapsed().toFixed(1) + "초"; }, 100);
}

const elapsed = () => (Date.now() - start) / 1000 + penalty;

$("field").addEventListener("click", e => {
  if (over) return;
  const rc = $("field").getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top;
  let hit = null, bd = 1e9;
  for (const t of targetsPos) {
    const d = Math.hypot(t.x - x, t.y - y);
    if (!t.done && d <= t.r && d < bd) { hit = t; bd = d; }
  }
  if (hit) {
    hit.done = true;
    mctx.fillStyle = "rgba(34,197,94,.3)"; mctx.strokeStyle = "#22c55e"; mctx.lineWidth = 3;
    mctx.beginPath(); mctx.arc(hit.x, hit.y, hit.r * 0.85, 0, 7); mctx.fill(); mctx.stroke();
    $("left").textContent = total - ++found;
    if (found === total) finish();
  } else if (!targetsPos.some(t => t.done && Math.hypot(t.x - x, t.y - y) <= t.r)) {   // 이미 찾은 체리를 또 눌러도 벌칙 없음
    penalty += 3;
    $("pen").textContent = "+" + penalty + "초";
    const f = $("field"); f.classList.remove("flash"); void f.offsetWidth; f.classList.add("flash");
  }
});

function finish() {
  over = true; clearInterval(tick);
  const t = Math.round(elapsed() * 10) / 10;
  const prev = best(level);
  const isBest = !prev || t < prev;
  if (isBest) saveBest(level, t);
  $("endlv").textContent = LEVELS[level].name + " 단계 클리어!";
  $("endtime").textContent = t.toFixed(1) + "초";
  $("endmsg").textContent = (penalty ? `벌칙 ${penalty}초 포함 · ` : "") + (isBest ? "🎉 내 최고 기록 갱신!" : "내 최고 기록 " + prev.toFixed(1) + "초");
  show("end");
  if (window.GL) GL.report("cherry_" + level, t);
}

$("again").onclick = () => begin(level);
$("tomenu").onclick = () => { drawMenu(); show("menu"); };
drawMenu();
</script>
<script>window.GL_GAMES = [
  { key:"cherry_easy",   label:"쉬움",   dir:"asc", fmt:d => d.value.toFixed(1) + "초" },
  { key:"cherry_normal", label:"보통",   dir:"asc", fmt:d => d.value.toFixed(1) + "초" },
  { key:"cherry_hard",   label:"어려움", dir:"asc", fmt:d => d.value.toFixed(1) + "초" },
];</script>
<script type="module" src="gl.js"></script>
</body>
</html>
