<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Block Tower</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none; }
  #app { height:100dvh; max-width:520px; margin:0 auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  a.back { text-decoration:none; font-size:14px; }
  .top { display:flex; justify-content:space-between; font-weight:800; font-size:16px; }
  #wrap { position:relative; flex:1; min-height:0; }
  canvas { width:100%; height:100%; display:block; border-radius:14px; touch-action:none; }
  #ov { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; }
  #ov h1 { margin:0; font-size:30px; }
  #ov p { margin:0; opacity:.8; font-size:15px; }
  #ov .big { font-size:52px; }
  .btn { padding:14px 34px; font-size:18px; margin-top:6px; }
  .hide { display:none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="app">
  <a class="back" href="index.html">← GameLand</a>
  <div class="top"><span id="score">0</span><span id="best"></span></div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="ov">
      <h1 id="ovt">Block Tower</h1>
      <div class="big hide" id="ovs"></div>
      <p id="ovp">Tap (or Space) to drop</p>
      <button class="btn" id="go">Play</button>
    </div>
  </div>
</div>

<script>
// 3D 아이소메트릭 탑쌓기: 블록이 x축 → z축 번갈아 미끄러지고, y축으로 쌓인다
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const HUE = 222;                     // 파스텔 단색 계열 (블루)
const SIZE = 10, SLAB = 1;           // 바닥 블록 크기, 한 층 두께
let W = 0, H = 0, dpr = 1, U = 16;
let state = "ready", layers, cur, axis, dir, fall, cam, camT, combo, flash, last = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  U = Math.min(W / 30, H / 34);
}
addEventListener("resize", resize);
function getBest() { try { return parseInt(localStorage.getItem("tower_best")) || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem("tower_best", v); } catch (e) {} }

// 월드 좌표(x, z, y) → 화면 좌표
const sx = (x, z) => W / 2 + (x - z) * 0.866 * U;
const sy = (x, z, y) => H * 0.62 + (x + z) * 0.5 * U - (y - cam) * U * 1.15;
const col = (i, dl) => `hsl(${HUE + i * 1.5} ${42 - Math.min(i, 20) * .6}% ${Math.min(90, 70 + dl + (i % 2) * 3)}%)`;

function drawBox(b, i, alpha) {
  const { x0, x1, z0, z1, y } = b, y1 = y + SLAB;
  const P = (x, z, yy) => [sx(x, z), sy(x, z, yy)];
  const face = (pts, c) => { ctx.beginPath(); ctx.moveTo(...pts[0]); for (const p of pts.slice(1)) ctx.lineTo(...p); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); };
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  face([P(x1, z0, y1), P(x1, z1, y1), P(x1, z1, y), P(x1, z0, y)], col(i, -8));    // 오른쪽 면 (x축 끝)
  face([P(x0, z1, y1), P(x1, z1, y1), P(x1, z1, y), P(x0, z1, y)], col(i, -20));   // 왼쪽 면 (z축 끝)
  face([P(x0, z0, y1), P(x1, z0, y1), P(x1, z1, y1), P(x0, z1, y1)], col(i, 10));  // 윗면
  ctx.globalAlpha = 1;
}

function newMover() {
  const p = layers[layers.length - 1];
  axis = layers.length % 2 ? "x" : "z";
  dir = 1;
  cur = { x0: p.x0, x1: p.x1, z0: p.z0, z1: p.z1, y: p.y + SLAB };
  const off = -18;                                           // 멀리서 미끄러져 들어옴
  if (axis === "x") { cur.x0 += off; cur.x1 += off; } else { cur.z0 += off; cur.z1 += off; }
}

function start() {
  resize();
  const h = SIZE / 2;
  layers = [{ x0: -h, x1: h, z0: -h, z1: h, y: 0 }];
  fall = []; cam = 0; camT = 0; combo = 0; flash = 0; state = "play";
  newMover();
  $("ov").classList.add("hide");
  $("score").textContent = "0";
}

function drop() {
  if (state !== "play") return;
  const p = layers[layers.length - 1];
  const a0 = axis + "0", a1 = axis + "1";
  const lo = Math.max(cur[a0], p[a0]), hi = Math.min(cur[a1], p[a1]);
  if (hi - lo <= 0) { fall.push({ b: { ...cur }, i: layers.length, vy: 0, a: 1 }); cur = null; return over(); }
  if (Math.abs(cur[a0] - p[a0]) < 0.3) {                    // PERFECT: 그대로 맞춤
    cur[a0] = p[a0]; cur[a1] = p[a1]; combo++; flash = 0.5;
  } else {
    combo = 0;
    const cut = { ...cur };
    if (cur[a0] < p[a0]) { cut[a1] = p[a0]; } else { cut[a0] = p[a1]; }
    fall.push({ b: cut, i: layers.length, vy: 0, a: 1 });
    cur[a0] = lo; cur[a1] = hi;
  }
  layers.push(cur);
  camT = Math.max(0, layers.length - 6) * SLAB;
  $("score").textContent = String(layers.length - 1);
  newMover();
}

function over() {
  state = "over";
  const n = layers.length - 1, b = getBest(), nb = n > b;
  if (nb) setBest(n);
  if (window.GL && n > 0) GL.report("tower", n);
  $("ovt").textContent = nb ? "New Best!" : "Game Over";
  $("ovs").textContent = n; $("ovs").classList.remove("hide");
  $("ovp").textContent = nb ? "" : "Best " + b;
  $("go").textContent = "Retry";
  $("ov").classList.remove("hide");
  $("best").textContent = "Best " + Math.max(b, n);
}

function update(dt) {
  cam += (camT - cam) * Math.min(1, 5 * dt);
  for (const f of fall) { f.vy += 30 * dt; f.b.y -= f.vy * dt; f.a -= dt * 0.8; }
  fall = fall.filter(f => f.a > 0);
  if (flash > 0) flash -= dt;
  if (state !== "play") return;
  const n = layers.length - 1, sp = Math.min(26, 11 + n * 0.45);
  const a0 = axis + "0", a1 = axis + "1";
  cur[a0] += dir * sp * dt; cur[a1] += dir * sp * dt;
  if (cur[a0] > 12) dir = -1;
  if (cur[a1] < -12) dir = 1;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${HUE} 45% 92%)`); g.addColorStop(1, `hsl(${HUE} 30% 76%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 바닥 그림자
  ctx.fillStyle = "rgba(40,50,90,.12)";
  ctx.beginPath(); ctx.ellipse(sx(0, 0), sy(0, 0, 0) + U * 2, U * 11, U * 5.5, 0, 0, 7); ctx.fill();
  layers.forEach((L, i) => drawBox(L, i));
  if (cur) drawBox(cur, layers.length);
  for (const f of fall) drawBox(f.b, f.i, Math.max(0, f.a));
  if (flash > 0) {
    ctx.globalAlpha = Math.min(1, flash * 2); ctx.fillStyle = "#fff"; ctx.font = "900 26px 'Noto Sans KR',sans-serif";
    ctx.textAlign = "center"; ctx.fillText(combo > 1 ? "PERFECT x" + combo : "PERFECT", W / 2, 54); ctx.globalAlpha = 1;
  }
}

function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (layers) { update(dt); draw(); }
  requestAnimationFrame(loop);
}

cv.addEventListener("pointerdown", e => { e.preventDefault(); drop(); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); state === "play" ? drop() : start(); } });
$("go").onclick = start;
$("best").textContent = getBest() ? "Best " + getBest() : "";
resize();
{ const h = SIZE / 2; layers = [{ x0: -h, x1: h, z0: -h, z1: h, y: 0 }]; cam = 0; camT = 0; fall = []; flash = 0; cur = null; }
requestAnimationFrame(t => { last = t; loop(t); });
</script>
<script>window.GL_GAMES = [{ key:"tower", label:"Block Tower", dir:"desc", fmt:d => d.value + " floors" }];</script>
<script type="module" src="gl.js"></script>
</body>
</html>
